name: Update company signals

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13,17,21,1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update signal data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MAX_COMPANIES: "30"
          FUNDAMENTAL_ENRICH_LIMIT: "20"
        run: python scripts/update_signals.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json data/history.json data/fundamentals_cache.json data/news_cache.json data/company_profiles.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update company signal data"
            git push
          fi
